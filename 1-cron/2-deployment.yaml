apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: keda-demo-cron
  labels:
    app: worker
spec:
  # KEDA takes over replica management once the ScaledObject is applied.
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
