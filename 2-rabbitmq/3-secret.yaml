# AMQP connection string for the KEDA RabbitMQ scaler.
# The 'host' key is referenced by the TriggerAuthentication.
# stringData lets us write the value in plain text; Kubernetes encodes it.
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-conn
  namespace: keda-demo-02
type: Opaque
stringData:
  host: "amqp://guest:guest@rabbitmq.keda-demo-02.svc.cluster.local:5672/"
