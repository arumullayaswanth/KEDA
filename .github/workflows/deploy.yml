name: Deploy KEDA Infra (EKS)

# Manual-only provisioning of the EKS infra for the KEDA demos via Terraform:
# VPC, EKS cluster + node group, Karpenter, KEDA, SQS, and IRSA.
# It does NOT deploy the demo workloads. Connect your client with the output
# `connect_command` and `kubectl apply` the demo manifests yourself.
#
# Run it from: GitHub > Actions > "Deploy KEDA Infra (EKS)" > Run workflow.
#
# Required GitHub repository variables (Settings > Variables > Actions):
#   AWS_ROLE_ARN     - IAM role for GitHub OIDC (created manually)
#   AWS_REGION       - e.g. us-east-1
#   TF_STATE_BUCKET  - S3 bucket for Terraform state (created manually)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: keda-demos/terraform.tfstate
  TF_WORKING_DIR: terraform

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    # Only run from the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -var="region=${AWS_REGION}"

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -input=false -var="region=${AWS_REGION}"

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -input=false -var="region=${AWS_REGION}"

      - name: Show outputs
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
